# Prometheus for the local stack.
#
# The service jobs in docs/specification-v1.2.md scrape each service at /actuator/prometheus. Those
# targets only resolve once the services run as containers in this stack, which they do not yet: they
# run from Gradle or an IDE. Until then their metrics arrive over OTLP and are scraped from the
# collector, which is the same data by a different route.
#
# Add a static_configs job per service as each one is containerised.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
