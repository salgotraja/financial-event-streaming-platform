# Host-based authentication for the strict-security profile.
#
# NFR-05.1: no plaintext database traffic in a cloud profile. Only hostssl lines appear below, so a
# client that negotiates no TLS is rejected at the connection, not merely discouraged by
# configuration. There is deliberately no `host` (non-SSL) line and no `trust` method anywhere.
#
# TYPE      DATABASE     USER                 ADDRESS         METHOD

# The container's own healthcheck and the entrypoint's initdb run over the Unix socket.
local       all          all                                  scram-sha-256

# Every TCP connection must be TLS, and must present a password.
hostssl     risk_alert   risk_alert_service   all             scram-sha-256

# Nothing else. An unmatched connection is rejected by PostgreSQL's implicit final deny.
