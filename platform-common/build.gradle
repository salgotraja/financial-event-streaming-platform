plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

// Cross-cutting mechanics shared by every service: Kafka producer and consumer defaults,
// deterministic idempotency keys, the DLQ publisher, structured logging, and OpenTelemetry and
// security-telemetry conventions (ADR-028).
//
// Charter: mechanics only. No business logic. A change that wants to add domain behaviour here
// belongs in a service module instead.

description = 'Cross-cutting platform mechanics shared by every service'

dependencies {
    api project(':contracts')

    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'org.springframework.boot:spring-boot-starter-kafka'
    api 'org.springframework.boot:spring-boot-starter-opentelemetry'

    runtimeOnly 'io.micrometer:micrometer-registry-otlp'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // Shared Testcontainers wiring, consumed by services as testImplementation
    // testFixtures(project(':platform-common')). Testcontainers over @EmbeddedKafka and over H2 so
    // tests run against the same Kafka and PostgreSQL implementations as the deployed system.
    // Reads each service's committed security/kafka-acls.yml. Version comes from the Boot BOM.
    testFixturesApi 'org.yaml:snakeyaml'

    // The authorization contract each service module extends is a fixture, so its test framework
    // has to be on the fixture's own compile classpath rather than only the consumers'.
    testFixturesApi 'org.junit.jupiter:junit-jupiter-api'
    testFixturesApi 'org.assertj:assertj-core'

    testFixturesApi 'org.springframework.boot:spring-boot-test'
    testFixturesApi 'org.springframework.boot:spring-boot-testcontainers'
    testFixturesApi 'org.testcontainers:testcontainers-junit-jupiter'
    testFixturesApi 'org.testcontainers:testcontainers-kafka'
    testFixturesApi 'org.testcontainers:testcontainers-postgresql'
    testFixturesApi 'org.testcontainers:testcontainers-grafana'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The strict-security stack provisions ACLs from the same per-service policy files the authorization
// tests apply, read by the same parser. Two readers of one policy would be two chances to drift.
//
// It lives here rather than in the root build because the parser and its classpath are this module's.
// Reaching into another project's source set resolves that project's configuration without the lock
// Gradle holds for it, which the configuration cache rejects. The output stays under the root build
// directory, where scripts/local-stack.sh reads it.
tasks.register('renderKafkaAcls', JavaExec) {
    group = 'verification'
    description = 'Renders every service kafka-acls.yml into arguments for the local stack.'

    def policyFiles = fileTree(rootDir) {
        include 'services/*/*/src/main/resources/security/kafka-acls.yml'
    }.files.sort()
    def output = rootProject.layout.buildDirectory.file('kafka-acls.args').get().asFile

    classpath = sourceSets.testFixtures.runtimeClasspath
    mainClass = 'dev.engnotes.fes.testing.KafkaAclScriptRenderer'
    args = [output.absolutePath] + policyFiles.collect { it.absolutePath }

    inputs.files(policyFiles)
    outputs.file(output)

    doFirst {
        if (policyFiles.isEmpty()) {
            throw new GradleException('No service kafka-acls.yml found. Every service commits one.')
        }
    }
}
