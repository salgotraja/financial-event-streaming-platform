plugins {
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

// Root is an aggregator. Deployable units are the service modules; each owns its own image,
// workload identity, consumer group and scaling policy (ADR-028).

allprojects {
    group = 'dev.engnotes'
    version = '0.0.1-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            // Java 25 LTS, pinned so the language level does not drift with the installed JDK.
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

// Plane isolation, the platform's central invariant (ADR-026, ADR-028).
//
// Nothing in the deterministic path may take a build dependency on the agent plane, on Neo4j, or on
// an LLM provider. A violation fails the build rather than producing a review comment.
ext.deterministicPlanePrefixes = [':services:ingestion', ':services:streaming', ':services:audit']
ext.agentOnlyDependencyMarkers = ['org.neo4j', 'com.anthropic', 'dev.langchain4j', 'io.github.ollama4j']

// Violations are collected at configuration time into plain serializable data. The task body must
// not touch Project, or the configuration cache cannot store it.
ext.planeIsolationOffenders = [] as List<String>
ext.planeIsolationModulesChecked = 0

subprojects { sub ->
    sub.afterEvaluate {
        if (!rootProject.deterministicPlanePrefixes.any { sub.path.startsWith(it) }) {
            return
        }
        rootProject.ext.planeIsolationModulesChecked += 1

        sub.configurations.each { config ->
            config.dependencies.each { dep ->
                if (dep instanceof ProjectDependency && dep.path.startsWith(':services:agent')) {
                    rootProject.ext.planeIsolationOffenders << "${sub.path} -> ${dep.path} (agent plane)".toString()
                } else if (dep.group != null
                        && rootProject.agentOnlyDependencyMarkers.any { dep.group.startsWith(it) }) {
                    rootProject.ext.planeIsolationOffenders <<
                            "${sub.path} -> ${dep.group}:${dep.name} (agent-plane dependency)".toString()
                }
            }
        }
    }
}

tasks.register('checkPlaneIsolation') {
    group = 'verification'
    description = 'Fails if a deterministic-plane module depends on the agent plane, Neo4j or an LLM provider.'

    def offenders = providers.provider { rootProject.planeIsolationOffenders.unique() }
    def modulesChecked = providers.provider { rootProject.planeIsolationModulesChecked }

    doLast {
        def found = offenders.get()
        if (!found.isEmpty()) {
            throw new GradleException(
                    "Plane isolation violated (ADR-026, ADR-028):\n  " + found.join('\n  '))
        }

        // Stated explicitly so a vacuous pass is never mistaken for a verified one. The count
        // includes the intermediate container projects (:services:ingestion, :services:audit), so it
        // runs ahead of the number of actual services.
        logger.lifecycle("Plane isolation: ${modulesChecked.get()} deterministic-plane module(s) checked")
    }
}

// The strict-security stack provisions ACLs from the same per-service policy files the authorization
// tests apply, read by the same parser. Two readers of one policy would be two chances to drift.
tasks.register('renderKafkaAcls', JavaExec) {
    group = 'verification'
    description = 'Renders every service kafka-acls.yml into arguments for the local stack.'

    def policyFiles = fileTree(rootDir) {
        include 'services/*/*/src/main/resources/security/kafka-acls.yml'
    }.files.sort()
    def output = layout.buildDirectory.file('kafka-acls.args').get().asFile

    dependsOn ':platform-common:testFixturesClasses'
    classpath = project(':platform-common').sourceSets.testFixtures.runtimeClasspath
    mainClass = 'dev.engnotes.fes.testing.KafkaAclScriptRenderer'
    args = [output.absolutePath] + policyFiles.collect { it.absolutePath }

    inputs.files(policyFiles)
    outputs.file(output)

    doFirst {
        if (policyFiles.isEmpty()) {
            throw new GradleException('No service kafka-acls.yml found. Every service commits one.')
        }
    }
}

tasks.register('check') {
    dependsOn 'checkPlaneIsolation'
    // Renders on every build so a malformed or unrenderable policy fails here, rather than when
    // someone brings up the strict-security stack days later.
    dependsOn 'renderKafkaAcls'
    dependsOn subprojects.collect { "${it.path}:check" }
}

tasks.register('build') {
    dependsOn 'check'
    dependsOn subprojects.collect { "${it.path}:build" }
}
