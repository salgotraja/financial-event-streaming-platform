plugins {
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false

    // Applied per subproject rather than here. Spotless brings LifecycleBasePlugin with it, which
    // registers its own check and build tasks; the root already registers both by hand below.
    alias(libs.plugins.spotless) apply false
}

// Root is an aggregator. Deployable units are the service modules; each owns its own image,
// workload identity, consumer group and scaling policy (ADR-028).

allprojects {
    group = 'dev.engnotes'
    version = '0.0.1-SNAPSHOT'
}

// Integration tests share the src/test source set with unit tests and are identified by class name.
// Three names qualify, and the last two are here because a name is not a reliable signal on its own:
// *AuthorizationTest extends the SecureKafkaStack fixture, and *StackTest tests a container fixture
// directly. Both start a broker. The split is only worth having if `test` genuinely needs no Docker,
// so a class that starts a container belongs on this list whatever it is called.
ext.integrationTestPatterns = ['*IntegrationTest', '*AuthorizationTest', '*StackTest']

// Generated Avro code is compiled, never authored. It is neither formatted nor counted as coverage.
ext.generatedClassPattern = 'dev/engnotes/fes/events/**'

// Read here in the root script scope, where the catalog accessor is unambiguous.
def jacocoToolVersion = libs.versions.jacoco.get()
def integrationTestPatterns = ext.integrationTestPatterns
def generatedClassPattern = ext.generatedClassPattern

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'

    java {
        toolchain {
            // Java 25 LTS, pinned so the language level does not drift with the installed JDK.
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // -parameters keeps constructor parameter names in the class file, which Spring and Jackson
        // both bind by. Without it a record or a constructor-injected bean binds by position.
        options.compilerArgs << '-parameters'
        // Warnings are reported, not fatal. A -Werror gate is a separate decision from surfacing the
        // warnings in the first place, and generated Avro sources are compiled through here too.
        options.compilerArgs << '-Xlint:all'
    }

    // Formatting is deliberately narrow: imports, whitespace and annotation placement. A full
    // reflow would rewrite hand-wrapped explanatory comment blocks that carry meaning.
    spotless {
        java {
            // Explicit target. The default covers every source set, which in contracts includes the
            // generated Avro output directory.
            target fileTree(projectDir) { include 'src/**/*.java' }

            // The order the source tree already uses: JDK first, everything else alphabetical,
            // static imports last. Spotless's default puts statics first, which would rewrite the
            // import block of every file in the repository for no benefit.
            importOrder('java|javax', '', '\\#')
            // The JavaParser engine, not the google-java-format default. That default reaches into
            // jdk.compiler internals that are not open on this toolchain, and fails with a
            // NoClassDefFoundError rather than a lint result.
            removeUnusedImports('cleanthat-javaparser-unnecessaryimport')
            forbidWildcardImports()
            trimTrailingWhitespace()
            endWithNewline()
            formatAnnotations()
        }
    }

    jacoco {
        toolVersion = jacocoToolVersion
    }

    // Unit tests: everything that is not named as an integration test. Runs without Docker.
    tasks.named('test', Test) {
        useJUnitPlatform()
        filter {
            integrationTestPatterns.each { excludeTestsMatching it }
        }
        jacoco {
            destinationFile = layout.buildDirectory.file('jacoco/test.exec').get().asFile
        }
    }

    // Integration tests: the Testcontainers-backed classes, in their own task with their own agent
    // output, so unit and integration coverage can be read apart as well as merged.
    def integrationTest = tasks.register('integrationTest', Test) {
        group = 'verification'
        description = 'Runs the Testcontainers-backed tests. Requires a running Docker daemon.'

        useJUnitPlatform()
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        shouldRunAfter tasks.named('test')

        filter {
            // Not every module has an integration test. contracts, for one, is pure schema.
            failOnNoMatchingTests = false
            integrationTestPatterns.each { includeTestsMatching it }
        }
        jacoco {
            destinationFile = layout.buildDirectory.file('jacoco/integrationTest.exec').get().asFile
        }
    }

    tasks.named('jacocoTestReport', JacocoReport) {
        dependsOn tasks.named('test'), integrationTest

        // Both agents' output, merged. A line covered only by an integration test still counts.
        executionData fileTree(layout.buildDirectory.dir('jacoco')).include('*.exec')
        classDirectories.setFrom(
                sourceSets.main.output.classesDirs.asFileTree.matching {
                    exclude generatedClassPattern
                })

        reports {
            xml.required = true
            html.required = true
        }
    }

    // No coverage threshold is set. The report is published first; a ratchet is a separate decision
    // taken against measured numbers rather than guessed ones.
    tasks.named('check') {
        dependsOn integrationTest
        dependsOn tasks.named('jacocoTestReport')
    }

    // One test class per JVM. SecureKafkaStack.apply only ever creates ACLs and never revokes them,
    // so a second ACL-applying class in one JVM inherits the first's grants and a denial assertion
    // becomes a silent pass. Every service module now has two such classes: its *AuthorizationTest
    // and its ServiceIdentityStackTest (ADR-031).
    tasks.named('integrationTest', Test) {
        forkEvery = 1
    }

    // Service images. The identity proof runs the service's own image, so a test must never be able
    // to run against a stale or absent one.
    plugins.withId('org.springframework.boot') {
        tasks.named('bootBuildImage') {
            imageName = "fes/${project.name}:local"
        }
        tasks.named('integrationTest') {
            dependsOn tasks.named('bootBuildImage')
        }
    }
}

// Plane isolation, the platform's central invariant (ADR-026, ADR-028).
//
// Nothing in the deterministic path may take a build dependency on the agent plane, on Neo4j, or on
// an LLM provider. A violation fails the build rather than producing a review comment.
ext.deterministicPlanePrefixes = [':services:ingestion', ':services:streaming', ':services:audit']
ext.agentOnlyDependencyMarkers = ['org.neo4j', 'com.anthropic', 'dev.langchain4j', 'io.github.ollama4j']

// Violations are collected at configuration time into plain serializable data. The task body must
// not touch Project, or the configuration cache cannot store it.
ext.planeIsolationOffenders = [] as List<String>
ext.planeIsolationModulesChecked = 0

subprojects { sub ->
    sub.afterEvaluate {
        if (!rootProject.deterministicPlanePrefixes.any { sub.path.startsWith(it) }) {
            return
        }
        rootProject.ext.planeIsolationModulesChecked += 1

        sub.configurations.each { config ->
            config.dependencies.each { dep ->
                if (dep instanceof ProjectDependency && dep.path.startsWith(':services:agent')) {
                    rootProject.ext.planeIsolationOffenders << "${sub.path} -> ${dep.path} (agent plane)".toString()
                } else if (dep.group != null
                        && rootProject.agentOnlyDependencyMarkers.any { dep.group.startsWith(it) }) {
                    rootProject.ext.planeIsolationOffenders <<
                            "${sub.path} -> ${dep.group}:${dep.name} (agent-plane dependency)".toString()
                }
            }
        }
    }
}

tasks.register('checkPlaneIsolation') {
    group = 'verification'
    description = 'Fails if a deterministic-plane module depends on the agent plane, Neo4j or an LLM provider.'

    def offenders = providers.provider { rootProject.planeIsolationOffenders.unique() }
    def modulesChecked = providers.provider { rootProject.planeIsolationModulesChecked }

    doLast {
        def found = offenders.get()
        if (!found.isEmpty()) {
            throw new GradleException(
                    "Plane isolation violated (ADR-026, ADR-028):\n  " + found.join('\n  '))
        }

        // Stated explicitly so a vacuous pass is never mistaken for a verified one. The count
        // includes the intermediate container projects (:services:ingestion, :services:audit), so it
        // runs ahead of the number of actual services.
        logger.lifecycle("Plane isolation: ${modulesChecked.get()} deterministic-plane module(s) checked")
    }
}

tasks.register('check') {
    dependsOn 'checkPlaneIsolation'
    // Renders on every build so a malformed or unrenderable policy fails here, rather than when
    // someone brings up the strict-security stack days later. The task lives in platform-common,
    // which owns the parser it runs.
    dependsOn ':platform-common:renderKafkaAcls'
    dependsOn subprojects.collect { "${it.path}:check" }
}

tasks.register('build') {
    dependsOn 'check'
    dependsOn subprojects.collect { "${it.path}:build" }
}
