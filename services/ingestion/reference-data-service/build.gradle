plugins {
    id 'java'
    id 'org.springframework.boot'
}

// FR-10. Publishes the synthetic instrument master to reference-data.instruments.
// Workload identity: reference-data-service. Kafka permission: connect and write
// reference-data.instruments only (specification-v1.2 line 603). No datastore: the compacted topic
// is the reconstruction source (FR-10.3), so there is no schema and no Flyway here.
// Topic shape (6 partitions, cleanup policy compact) is broker-side configuration.

description = 'Publishes the synthetic instrument master to reference-data.instruments'

repositories {
    maven {
        url = 'https://packages.confluent.io/maven/'
        content { includeGroupByRegex 'io\\.confluent.*' }
    }
}

dependencies {
    implementation project(':platform-common')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'io.confluent:kafka-avro-serializer:7.9.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
    testImplementation testFixtures(project(':platform-common'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
