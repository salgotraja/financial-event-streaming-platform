# Least-privilege Kafka policy for the corporate-action-producer workload identity.
# See trade-producer's policy for the rules that govern this file. Everything absent is denied.
#
# Denials proved in CorporateActionProducerAuthorizationTest: it may not read corporate-actions, and
# it may not write another service's topic.

principal: corporate-action-producer

allowed:
  - resourceType: TOPIC
    name: corporate-actions
    operations: [WRITE]
