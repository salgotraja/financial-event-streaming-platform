spring:
  application:
    name: trade-producer
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
        auto.register.schemas: false

# Durability (acks=all, idempotence, batching, lz4) is applied by platform-common's
# ProducerDurabilityConfiguration, not here, so a service cannot ship with weaker settings.

fes:
  trade-producer:
    topic: trades.raw
    # FR-01.1 load simulation mode. Off by default: this is a mode, not boot behaviour. TradeEvent
    # carries no field marking a record synthetic, and audit-service archives trades.raw as
    # evidence, so switching this on in an environment nobody intended puts synthetic trades into
    # the audit record indistinguishably from real ones.
    generation:
      enabled: ${FES_TRADE_PRODUCER_GENERATION_ENABLED:false}

# API docs (springdoc OpenAPI and the Scalar UI) are off unless the dev profile turns them on.
# scalar.enabled is belt and braces over springdoc's own condition, so a change there cannot expose the UI.
springdoc:
  api-docs:
    enabled: false
scalar:
  enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs

---
# Running this service from Gradle or an IDE against `scripts/local-stack.sh up dev`. It does not work
# against the strict-security stack, whose listeners need SASL_SSL client settings.
spring:
  config:
    activate:
      on-profile: dev
  kafka:
    bootstrap-servers: localhost:29092,localhost:29093,localhost:29094
server:
  port: 8091
springdoc:
  api-docs:
    enabled: true
  show-actuator: true
scalar:
  enabled: true
  telemetry: false
