spring:
  application:
    name: market-data-cache-projector
  data:
    redis:
      # An unavailable Redis must surface as an exception the error handler can classify, and it
      # must do so far inside max.poll.interval.ms. Without these the Lettuce call blocks on the
      # frozen connection, the consumer thread stops polling, and the broker evicts the consumer:
      # the exact failure the pausing back-off handler exists to prevent.
      timeout: 2s
      connect-timeout: 2s
  kafka:
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    consumer:
      # The group name is the service name, fixed by specification-v1.2 line 625 and by the IAM
      # policy and KEDA query that scope it. Never suffixed.
      group-id: market-data-cache-projector
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer wraps the Avro one so a malformed payload arrives at the listener
      # as a record the error handler can quarantine, instead of failing inside the deserialiser
      # where it would stall the partition (ADR-027).
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
    producer:
      # Producing is limited to market-data.ticks.dlq. This service never writes a financial topic.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
        auto.register.schemas: false

# Redis connection details are otherwise absent. Boot defaults host/port to localhost:6379, and a
# deployment overrides SPRING_DATA_REDIS_HOST, _PORT, _USERNAME and _PASSWORD from the environment.
# Declaring them here with empty defaults would make Lettuce attempt AUTH with an empty username
# against the dev profile's unauthenticated Redis, which fails for a reason that looks like a
# credential bug.

# enable.auto.commit=false and MANUAL_IMMEDIATE come from platform-common's
# ConsumerAcknowledgementConfiguration, not from here, so this service cannot ship weaker offset
# management by omission. isolation.level is deliberately unset (ADR-019).

fes:
  market-data-cache-projector:
    topic: market-data.ticks
    consumer-instance: ${HOSTNAME:market-data-cache-projector-local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
