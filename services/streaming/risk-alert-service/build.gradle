plugins {
    id 'java'
    id 'org.springframework.boot'
}

// ADR-019: at-least-once, so alertId is derived deterministically rather than randomly.
// ADR-027: per-record quarantine to trades.enriched.dlq, no event-type-wide breaker.
// ADR-035: the governed rule set is folded from a non-compacted topic into a per-ruleId version
// timeline, and the version in force is selected by the trade's own event time.
// Workload identity: risk-alert-service. Consumer group: the same name.
// Kafka permission: read trades.enriched and risk-rules.events, write notifications.alerts and
// trades.enriched.dlq.

description = 'Evaluates governed risk rules against trades.enriched and publishes notifications.alerts'

repositories {
    maven {
        url = 'https://packages.confluent.io/maven/'
        content { includeGroupByRegex 'io\\.confluent.*' }
    }
}

dependencies {
    implementation project(':platform-common')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation libs.confluent.kafka.avro.serializer

    // Increment 2: the first relational store in this repository. Spring Data JDBC rather than JPA
    // per .claude/rules/database.md. The store itself uses JdbcClient directly, because its three
    // statements are an ON CONFLICT ... RETURNING upsert that a CrudRepository would only obscure;
    // the starter is what supplies the DataSource, JdbcClient and transaction manager.
    // All four are managed by the Spring Boot BOM, so none of them carry a version here.
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    // Spring Boot 4 split Flyway's autoconfiguration out of spring-boot-autoconfigure into its own
    // module. org.flywaydb:flyway-core alone (the brief's original dependency, correct for Boot 3)
    // puts Flyway on the classpath but not FlywayAutoConfiguration, so migrations silently never
    // ran. spring-boot-starter-flyway is the BOM-managed replacement: it pulls in flyway-core and
    // the autoconfiguration module together.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
    testImplementation 'io.micrometer:micrometer-registry-prometheus'
    testImplementation testFixtures(project(':platform-common'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
