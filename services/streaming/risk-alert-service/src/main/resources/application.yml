spring:
  application:
    name: risk-alert-service
  datasource:
    url: ${RISK_ALERT_DB_URL:jdbc:postgresql://localhost:5432/risk_alert}
    username: ${RISK_ALERT_DB_USER:risk_alert_service}
    password: ${RISK_ALERT_DB_PASSWORD:risk_alert_service}
    hikari:
      # Bounds acquiring a connection from the pool. Default is 30s, longer than a stalled
      # listener thread should ever wait before backOffFor gets a chance to classify the failure
      # (ADR-027, ADR-036).
      connection-timeout: 5000
      data-source-properties:
        # PGJDBC connection properties, both in SECONDS (not milliseconds, unlike the Hikari
        # setting above). connectTimeout bounds opening a new physical connection. socketTimeout is
        # the one that matters most: it is what converts a database that accepted the connection
        # and then stopped answering into a QueryTimeoutException, rather than an indefinite block
        # on the listener thread that never reaches backOffFor at all and eventually crosses
        # max.poll.interval.ms instead. 10s comfortably exceeds this service's point lookups and
        # single upsert, and Flyway's one migration, which only creates two tables at startup.
        connectTimeout: 5
        socketTimeout: 10
  flyway:
    # Flyway runs at startup and before the readiness gate opens, so a service that cannot migrate
    # never begins consuming trades against a schema it does not have.
    enabled: true
    locations: classpath:db/migration
  kafka:
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    consumer:
      # The group name is the service name, fixed by the IAM policy and the KEDA query that scope
      # it. Never suffixed. The rule consumer does not use it: it assign()s partitions and joins no
      # group at all.
      group-id: risk-alert-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
        auto.register.schemas: false

# enable.auto.commit=false and MANUAL_IMMEDIATE come from platform-common's
# ConsumerAcknowledgementConfiguration, so this service cannot ship weaker offset management by
# omission. isolation.level is deliberately unset (ADR-019).

fes:
  risk-alert-service:
    topic: trades.enriched
    rule-topic: risk-rules.events
    output-topic: notifications.alerts
    consumer-instance: ${HOSTNAME:risk-alert-service-local}
    rule-timeline-timeout: 60s
    # The rolling distribution's horizon, in seconds. Configuration, not a governed rule parameter.
    # The prune deletes buckets outside this horizon, so a governed rule carrying a longer horizon
    # would fold a window already partly deleted and return a quietly wrong statistic rather than an
    # error. Writer-prune and reader-fold must agree on one number, the same reason MarketCacheKeys
    # shares WINDOW_SECONDS between the projector and enrichment.
    volume-window-seconds: 3600

risk:
  rules:
    # The ungoverned bootstrap set. Version 0 by definition, and it applies only while no governed
    # ACTIVE version of the same rule-type is in force (ADR-035). A governed version outranks it and
    # these values then never return.
    - rule-id: price-deviation
      rule-type: price-deviation
      parameters:
        warn-deviation-percent: "2.0"
        critical-deviation-percent: "5.0"
    - rule-id: position-limit
      rule-type: position-limit
      parameters:
        warn-position-quantity: "10000"
        critical-position-quantity: "50000"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
