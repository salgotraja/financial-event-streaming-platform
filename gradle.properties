# Build execution settings. Behaviour of the build itself, never of the platform.

# The module graph is wide and shallow: contracts and platform-common, then independent services
# that share no state. Parallel execution is the shape the layout was designed for.
org.gradle.parallel=true
org.gradle.caching=true

# The plane-isolation and ACL-rendering tasks are written to be configuration-cache safe (they read
# plain serializable data at configuration time and never touch Project in a task body). Enabling it
# here keeps that property enforced rather than aspirational.
org.gradle.configuration-cache=true

# Headroom for Avro code generation and the Testcontainers-backed integration tests.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
