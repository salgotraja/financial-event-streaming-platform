plugins {
    id 'java-library'
    alias(libs.plugins.avro)
}

dependencies {
    api libs.avro

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Every class under src/main here is generated by the Avro plugin, and two lint categories fire on
// that output with no source to fix: the generated SpecificRecord types declare no serialVersionUID,
// and each file opens with the schema comment ahead of its package declaration. Narrowed here rather
// than weakened for the whole build.
tasks.named('compileJava') {
    options.compilerArgs += ['-Xlint:-serial', '-Xlint:-dangling-doc-comments']
}

// FR-02.2 schema evolution gate. SchemaCompatibilityTest asserts every schema can read data written
// by the accepted baseline. Accepting a deliberate break is an explicit, reviewable action (ADR-029).
tasks.register('updateSchemaBaseline', Copy) {
    group = 'contracts'
    description = 'Accepts the current schemas as the new compatibility baseline. Review the diff.'

    from 'src/main/avro'
    into 'src/test/resources/schema-baseline'
    include '**/*.avsc'

    doLast {
        logger.lifecycle('Schema baseline updated. Commit the diff and justify any breaking change.')
    }
}

avro {
    stringType = 'String'
    fieldVisibility = 'PRIVATE'
    enableDecimalLogicalType = true
    outputCharacterEncoding = 'UTF-8'
}

// Shared event contracts. Avro schema files live in src/main/avro/ and are the single definition of
// every topic payload (ADR-002, ADR-028). Namespace: dev.engnotes.fes.events.
//
// This module holds contracts only. No business logic, no Spring wiring, no service code.
// The Avro code-generation plugin is added when the first schema lands in README Phase 1.

description = 'Avro event contracts shared by every producer and consumer'
