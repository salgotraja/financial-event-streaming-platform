name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # FR-02.2. A schema change that breaks compatibility must fail before merge, so this runs
      # ahead of the wider build and reports on its own (ADR-029).
      - name: Schema compatibility gate
        run: ./gradlew :contracts:test --tests '*SchemaCompatibilityTest'

      # ADR-026 and ADR-028. No ingestion, streaming or audit module may depend on the agent plane,
      # Neo4j or an LLM provider.
      - name: Plane isolation gate
        run: ./gradlew checkPlaneIsolation

      - name: Build and test
        run: ./gradlew build

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          # Both task reports. Unit tests and the Testcontainers-backed integration tests run as
          # separate tasks and write separate directories under reports/tests.
          path: '**/build/reports/tests'
          if-no-files-found: ignore
