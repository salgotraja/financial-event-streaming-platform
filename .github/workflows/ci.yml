name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # FR-02.2. A schema change that breaks compatibility must fail before merge, so this runs
      # ahead of the wider build and reports on its own (ADR-029).
      - name: Schema compatibility gate
        run: ./gradlew :contracts:test --tests '*SchemaCompatibilityTest'

      # ADR-026 and ADR-028. No ingestion, streaming or audit module may depend on the agent plane,
      # Neo4j or an LLM provider.
      - name: Plane isolation gate
        run: ./gradlew checkPlaneIsolation

      - name: Build and test
        run: ./gradlew build

      # .claude is the single source for agent configuration; .agents and .codex are generated.
      - name: Agent configuration in sync
        run: ./scripts/sync-agent-config.sh --check

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/test'
          if-no-files-found: ignore
